spring.main.web-application-type=none
spring.main.banner-mode=off
logging.level.root=WARN

metallum.ui.type=lanterna
metallum.ui.music-search-provider=youtube_music
metallum.browser.visible=false
metallum.cache.enabled=true
metallum.cache.directory=${user.home}/.config/metallum/cache
metallum.cache.search.ttl=1d
metallum.cache.band.ttl=7d
metallum.cache.album.ttl=30d
